<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录界面</title>
    <link rel="stylesheet" href="./static/css/base.css">
    <link rel="stylesheet" href="./static/css/login.css">
</head>
<body>
    <div>
        <div class="name wrapper">
            <h1>此处为该借贷风控系统的名称或图标</h1>
        </div>
        <div class="main wrapper">
            <h2>————欢迎登录————</h2>
            <div class="login-type"><a href="#">密码登录</a><a href="#">验证码登录</a></div>
            <form id="loginForm">
                <input type="text" id="phone" placeholder="请输入用户名/手机号码">
                <hr>
                <br>
                <input type="password" id="password" placeholder="请输入密码">
                <hr>
                <br>
                <button>登录</button>
            </form>
            <span>还没有账号？<a href="registration.html">注册</a></span><a href="#" class="forget-password">忘记密码?</a>
            <br>
            <label><input type="checkbox" name="">同意并接受<a href="#">《服务条款》</a><a href="#">《隐私政策》</a></label>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script>
        (function () {
            const form = document.getElementById('loginForm');
            if (!form) return;

            form.addEventListener('submit', function (e) {
                e.preventDefault(); // 阻止默认表单提交（页面刷新）

                const phone = document.getElementById('phone')?.value?.trim();
                const password = document.getElementById('password')?.value?.trim();

                // 前端简单校验
                if (!phone) {
                    alert('请输入手机号');
                    return;
                }
                if (!password) {
                    alert('请输入密码');
                    return;
                }

                // 发送 JSON 请求（后端需用 @RequestBody 接收）
                axios.post('/doLogin', {
                    phone: phone,
                    password: password
                })
                .then(response => {
                    const res = response.data;
                    if (res.code === 200) {
                        alert('登录成功！欢迎：' + res.data.name);
                        // 跳转到主页面
                        window.location.href = 'index.html';
                    } else {
                        // 后端返回的业务错误（如用户不存在、密码错误）
                        alert('登录失败：' + (res.msg || '未知错误'));
                    }
                })
                .catch(error => {
                    // 网络错误、404、500、参数解析失败等
                    console.error('请求异常:', error);
                    if (error.response) {
                        // 后端返回了错误状态码（如 400, 500）
                        const status = error.response.status;
                        const data = error.response.data;
                        if (status === 400) {
                            alert('请求参数错误，请检查手机号和密码格式');
                        } else if (status === 500) {
                            alert('服务器内部错误，请稍后再试');
                        } else {
                            alert('登录失败：' + (data.msg || '系统异常'));
                        }
                    } else if (error.request) {
                        // 请求发出但没收到响应（服务没启动？）
                        alert('无法连接到服务器，请检查后端是否运行');
                    } else {
                        alert('请求配置错误：' + error.message);
                    }
                });
            });
        })();
    </script>
</body>
</html>

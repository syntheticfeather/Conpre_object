<!-- 当前文档的类型 -->
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- 字符集 -->
    <meta charset="UTF-8">
    <!-- 移动端上的缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HtmlTags</title>

    <style>
        /* 所有的都去除边框 */
        * {
            border: none;
            margin: 0;
            padding: 0;
        }

        div {
            width: 80%;
            margin: 0 auto;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #9d9a9a;
        }

        .header-top a {
            text-decoration: none;
            /* 超链接字体为黑色 */
            color: black;
        }

        .select-box {
            display: flex;
            /* 内部元素水平均匀排列 */
            align-content: space-around;
            justify-content: space-around;
            border: black 1px solid;
        }

        .select-box input {
            width: 300px;
            height: 30px;
            margin: 50px 0;
            padding-left: 5px;
            border: black 1px solid;
        }

        select {
            width: 300px;
            height: 30px;
            margin: auto 0;
            border: black 1px solid;
        }

        button {
            width: 50px;
            height: 30px;
            margin: 50px 0;
            background-color: #2963e0;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .main-content {
            margin-top: 50px;
            display: flex;
            border: black 1px solid;
        }

        .main-content table {
            width: 100%;
            /* 给table加边框线 */
            border-collapse: collapse;            
        }

        .main-content table th,
        .main-content table td {
            border: black 1px solid;
            padding: 10px;
            text-align: center;
        }

        .main-content table th {
            background-color: #9d9a9a;            

        }

        .main-content table td img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
        }

        .main-content table td a {
            text-decoration: none;
            color: #2963e0;
            margin-left: 10px;
            border: black 1px solid;
            background-color: #d0cccc;
            color: black;
            /* 圆角 */
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <header>
        <div class="header-top">
            <h1>
                Tlias智能学习辅助系统
            </h1>
            <a href="#">
                退出登录
            </a>
        </div>
    </header>

    <main>
        <div class="select-box">
            <input type="text" placeholder="请输入姓名" class="name-input">
            <!-- 添加提示词 -->
            <select aria-placeholder="性别" class="gender-select">
                <option value="1">男</option>
                <option value="2">女</option>
            </select>
            <select aria-placeholder="职位" class="position-select">
                <option value="1">学生</option>
                <option value="2">管理员</option>
            </select>
            <button>
                查询
            </button>
            <button>
                清空
            </button>
        </div>

        <div class="main-content">
            <!-- 头行 有 姓名 性别 头像 职位 入职日期 最后操作时间 操作 的 列表-->
            <table>
                <thead>
                    <tr>
                        <th>姓名</th>
                        <th>性别</th>
                        <th>头像</th>
                        <th>职位</th>
                        <th>入职日期</th>
                        <th>最后操作时间</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody class="main-content-table">
                    <tr>
                        <td>张三</td>
                        <td>男</td>
                        <td>
                            <img src="https://www.tlias.com/upload/20210715/1626311112_1.jpg" alt="头像">
                        </td>
                        <td>学生</td>
                        <td>2021-07-15</td>
                        <td>2021-07-15 10:00:00</td>
                        <td>
                            <a href="#">编辑</a>
                            <a href="#">删除</a>
                        </td>
                    </tr>
                    <tr>
                        <td>李四</td>
                        <td>女</td>
                        <td>
                            <img src="https://www.tlias.com/upload/20210715/1626311112_1.jpg" alt="头像">
                        </td>
                        <td>管理员</td>
                        <td>2021-07-15</td>
                        <td>2021-07-15 10:00:00</td>
                        <td>
                            <a href="#">编辑</a>
                            <a href="#">删除</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="script.js">

    </script>
</body>

</html>

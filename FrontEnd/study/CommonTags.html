<!-- 当前文档的类型 -->
<!DOCTYPE html>
<html lang="en">

<head>
    <!-- 字符集 -->
    <meta charset="UTF-8">
    <!-- 移动端上的缩放 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HtmlTags</title>
</head>

<body>
    <h1>这是html的所有tag的介绍页面</h1>

    <img src="img/1.png" alt="no img">

    <!-- 熟悉一下其他标题 -->
    <h2>这是h2</h2>
    <h3>这是h3</h3>
    <h4>这是h4</h4>
    <h5>这是h5</h5>
    <h6>这是h6</h6>

    <!-- 熟悉一下段落 -->
    <p>这是p标签，段落标签，用于显示文本内容，可以包含多个段落</p>
    <p>这是另一个段落</p>

    <!-- 熟悉一下链接 -->
    <a href="https://www.baidu.com">百度</a>

    <!-- 熟悉一下图片 -->
    <img src="img/2.png" alt="no img">

    <!-- 熟悉一下列表 -->
    <ul>
        <li>列表1</li>
        <li>列表2</li>
        <li>列表3</li>
    </ul>

    <!-- 熟悉一下表格 -->
    <table>
        <th>编号</th>
        <th>姓名</th>
        <th>性别</th>
        <tr>
            <td>1</td>
            <td>张三</td>
            <td>男</td>
        </tr>
        <tr>
            <td>2</td>
            <td>李四</td>
            <td>女</td>
        </tr>
    </table>



    <!-- 熟悉一下表单 -->
    <!-- 什么叫action？  -->
    <form action="https://httpbin.org/post" method="post">
        <label for="name">姓名：</label>
        <input type="text" id="name" name="name">


        <input type="submit" value="提交">
    </form>

</body>

</html>

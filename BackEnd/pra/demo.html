<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文章管理系统</title>
    <!-- 引入Element Plus CSS -->
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        #app {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>文章管理系统</h1>
            <div>
                <el-button v-if="!isLogin" @click="showLogin = true">登录</el-button>
                <el-button v-else @click="logout">退出</el-button>
            </div>
        </div>

        <!-- 登录对话框 -->
        <el-dialog v-model="showLogin" title="用户登录" width="30%">
            <el-form :model="loginForm" label-width="80px">
                <el-form-item label="用户名">
                    <el-input v-model="loginForm.username" placeholder="请输入用户名"></el-input>
                </el-form-item>
                <el-form-item label="密码">
                    <el-input v-model="loginForm.password" type="password" placeholder="请输入密码"></el-input>
                </el-form-item>
            </el-form>
            <template #footer>
                <el-button @click="showLogin = false">取消</el-button>
                <el-button type="primary" @click="handleLogin">登录</el-button>
            </template>
        </el-dialog>

        <!-- 主内容区 -->
        <router-view></router-view>
    </div>

    <!-- 引入Vue 3和Element Plus -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/element-plus"></script>
    <script>
        const { createApp, ref } = Vue;
        const { ElButton, ElDialog, ElForm, ElFormItem, ElInput } = ElementPlus;

        const app = createApp({
            setup() {
                const isLogin = ref(false);
                const showLogin = ref(false);
                const loginForm = ref({
                    username: '',
                    password: ''
                });

                const handleLogin = () => {
                    // 这里调用登录API
                    console.log('登录:', loginForm.value);
                    isLogin.value = true;
                    showLogin.value = false;
                };

                const logout = () => {
                    isLogin.value = false;
                };

                return {
                    isLogin,
                    showLogin,
                    loginForm,
                    handleLogin,
                    logout
                };
            }
        });

        app.use(ElementPlus);
        app.component(ElButton.name, ElButton);
        app.component(ElDialog.name, ElDialog);
        app.component(ElForm.name, ElForm);
        app.component(ElFormItem.name, ElFormItem);
        app.component(ElInput.name, ElInput);

        app.mount('#app');
    </script>
</body>
</html>

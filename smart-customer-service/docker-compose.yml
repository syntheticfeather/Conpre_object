# smart-customer-service/docker-compose.yml
services:
  mongodb:
    image: mongo:7.0
    container_name: mongodb-smart-cs
    restart: unless-stopped
    ports:
      - "27017:27017"  # 暴露端口，允许本地连接
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: smart_customer_service
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d:ro
    networks:
      - messaging
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
      image: chromadb/chroma:0.5.23  # 使用稳定版本
      container_name: chromadb
      restart: unless-stopped
      ports:
        - "8001:8000"  # 映射到不同端口，避免和app冲突
      environment:
        - IS_PERSISTENT=TRUE
        - PERSIST_DIRECTORY=/chroma/chroma
        - ANONYMIZED_TELEMETRY=FALSE
        - ALLOW_RESET=TRUE  # 根据需要设置为True
        # - CHROMA_SERVER_AUTHN_CREDENTIALS=admin:admin123  # 可选：添加认证
        # - CHROMA_SERVER_AUTHN_PROVIDER=chromadb.auth.token_authn.TokenAuthServerProvider
      volumes:
        - chromadb_data:/chroma/chroma  # 数据持久化
      networks:
        - messaging
      healthcheck:
        test: ["CMD", "curl", "-f", "http://localhost:8000/api/v2/heartbeat"]
        interval: 10s
        timeout: 5s
        retries: 5
  
  smart-cs-app:
    build: .
    container_name: smart-cs-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://admin:admin123@mongodb:27017/smart_customer_service?authSource=admin
      - CHROMADB_MODE=remote  # 改为远程模式
      - CHROMADB_HOST=chromadb  # 服务名
      - CHROMADB_PORT=8000  # 容器内端口
      - PYTHONUNBUFFERED=1
      - LOG_LEVEL=INFO
      - JAVA_API_BASE_URL=http://localhost:8080/api  # 使用本地地址访问
      - LOAN_SERVICE_URL=http://host.docker.internal:8080/api
      - KNOWLEDGE_INIT_FILE=/app/knowledge-init/initial_data.json  # 知识初始化文件路径
      - KNOWLEDGE_INIT_DIRECTORY=/app/knowledge-init  # 知识初始化目录路径
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      # 不再需要挂载 chromadb_data
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy  # 等待健康检查通过
      chromadb:
        condition: service_healthy  # 等待健康检查通过
    networks:
      - messaging
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongodb_data:
    driver: local
  chromadb_data:  # 新增 volume
    driver: local

networks:
  messaging:
    external: true
    name: personal-loan_messaging  # 根据实际网络名调整
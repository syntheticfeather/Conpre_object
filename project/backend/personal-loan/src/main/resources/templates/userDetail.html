<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
          <!-- 用户管理面板 -->
        <div class="user-dashboard dashboard" id="user-management-content">
            <!-- 左侧子导航栏 -->
            <div class="side-bar">
                <ul>
                    <li class="side-item">
                        <button class="side-link active" data-target="">用户管理</button>
                        <i class="iconfont icon-jinru"></i>
                    </li>
                    <li class="side-item">
                        <button class="side-link" data-target="">黑名单管理</button>
                        <i class="iconfont icon-jinru"></i>
                    </li>
                </ul>
            </div>
            <!-- 右侧内容面板 -->
            <div class="main-content">
                <div class="header">
                    <h2 class="title">用户管理</h2>
                </div>
                <!-- 用户列表容器 -->
                <div class="user-content table-content">
                    <div class="user-table data-table">
                        <table id="user-table">
                            <thead>
                                <tr>
                                <th>序号</th>
                                <th>用户名</th>
                                <th>信誉分</th>
                                <th>目前借贷情况</th>
                                <th>总交易笔数</th>
                                <th>预期还款项目</th>
                                <th>待定</th>
                                <th>快捷操作</th>
                                </tr>
                            </thead>
                            <tbody></tbody>
                        </table>
                    </div>
                    <!-- 分页控件 -->
                    <div id="user-pagination" class="pagination">
                        <button id="prev-user-page" disabled>上一页</button>
                        <span id="user-page-info">第 1 页，共 1 页</span>
                        <button id="next-user-page">下一页</button>
                    </div>
                </div>
                
                <!-- 用户详情模态框（复用 audition-detail 结构，改 ID） -->
                <div id="user-detail" class="detail-container">
                    <div id="user-info-section">
                        <h3>用户基本信息</h3>
                        <p><strong>真实姓名：</strong><span id="user-real-name">—</span></p>
                        <p><strong>手机号：</strong><span id="user-phone">—</span></p>
                        <p><strong>注册时间：</strong><span id="user-register-time">—</span></p>
                        <p><strong>信誉分：</strong><span id="user-credit-score" style="color:#e74c3c;">—</span></p>
                    </div>
                    <div id="user-auth-section">
                        <h3>认证材料</h3>
                        <div id="user-materials-container"></div>
                    </div>
                    <div class="action-buttons">
                        <button class="btn btn-primary" onclick="document.getElementById('user-detail').style.display='none'">关闭</button>
                    </div>
                </div>
            </div>
        </div>
        <!-- 黑名单管理组件 -->
        <!-- 黑名单用户列表 -->
        <div class="black-user-content table-content">
            <div class="user-table data-table">
                <table id="black-user-table">
                    <thead>
                        <tr>
                            <th>序号</th>
                            <th>用户名</th>
                            <th>信誉分</th>
                            <th>目前借贷情况</th>
                            <th>总交易笔数</th>
                            <th>总贷款金额</th>
                            <th>总还款金额</th>
                            <th colspan="4">操作</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- JS填充 -->
                    </tbody>
                </table>
            </div>
            <!-- 分页控件 -->
            <div id="user-pagination" class="pagination">
                <button id="prev-user-page" disabled>上一页</button>
                <span id="user-page-info">第 1 页，共 1 页</span>
                <button id="next-user-page">下一页</button>
            </div>
        </div>                
        <!-- 黑名单用户详情框 -->
        <div id="black-user-detail" class="detail-container">
            <div id="user-info-section">
                <h3>用户基本信息</h3>
                <p><strong>真实姓名：</strong><span id="user-real-name">—</span></p>
                <p><strong>手机号：</strong><span id="user-phone">—</span></p>
                <p><strong>注册时间：</strong><span id="user-register-time">—</span></p>
                <p><strong>信誉分：</strong><span id="user-credit-score" style="color:#e74c3c;">—</span></p>
            </div>
            <div id="user-auth-section">
                <h3>认证材料</h3>
                <div id="user-materials-container"></div>
            </div>
            <div class="action-buttons">
                <button class="btn btn-primary" onclick="document.getElementById('user-detail').style.display='none'">关闭</button>
            </div>
        </div>
</body>
</html>

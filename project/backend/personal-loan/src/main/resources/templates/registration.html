<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册界面</title>
    <link rel="stylesheet" href="../static/css/base.css">
    <link rel="stylesheet" href="../static/css/registration.css">
    <link rel="stylesheet" href="../static/iconfont/iconfont.css">
</head>
<body>
    <div>
        <div class="main wrapper">
            <!-- 标题 -->
            <h2>——Register——</h2>
            <form id="registerForm">
                <!-- 输入账户信息 -->
                <div class="base-information" id="baseInformation">
                    <div class="infor">
                        <p><i>* </i>用户名(2-20位)</p>
                        <div class="input-group">
                            <input type="text" placeholder="请输入用户名" id="adminName" autocomplete="off">
                            <span class="decration"></span>
                        </div>
                        <div id="adminNameError" class="error-message">用户名格式错误</div>

                        <p><i>* </i>密码(8-20位，包含大小写字母、数字和特殊字符)</p>
                        <div class="input-group password-input">
                            <input type="password" placeholder="请输入密码" id="password" autocomplete="off">
                            <button type="button" id="showPassword-btn">
                                <i class="iconfont icon-browse"></i>
                                <i class="iconfont icon-eye-close"></i>
                            </button>
                        </div>
                        <div id="passwordError" class="error-message">密码格式错误</div>

                        <p><i>* </i>确认密码（请再次输入密码）</p>
                        <div class="input-group password-input">
                            <input type="password" placeholder="请确认密码" id="confirmPassword" autocomplete="off">
                            <button type="button" id="showConfirmPassword-btn">
                                <i class="iconfont icon-browse"></i>
                                <i class="iconfont icon-eye-close"></i>
                            </button>
                        </div>
                        <div id="confirmPasswordError" class="error-message">确认密码与密码不一致</div>
                    </div>
                    <!-- 登录按钮 -->
                    <p class="login-btn">返回登录</p>
                    <!-- 确认按钮 -->
                    <button type = "button" class="confirm-btn btn">确认</button>
                </div>
                
                <!-- 输入验证信息 -->
                <div id="authentication"> 
                    <p><i>* </i>手机号码</p>
                    <input type="text" placeholder="请输入手机号码" id="phone"  autocomplete="off">
                    <div id="phoneError" class="error-message">手机号码格式错误</div>

                    <p><i>* </i>短信验证码</p>
                    <input type="text" placeholder="请输入短信验证码" id="smsCode"  autocomplete="off">
                    <div id="smsCodeError" class="error-message">短信验证码格式错误</div> 
                    
                    <div class="back-line">
                        <!-- 返回注册信息输入 -->
                        <p class="close-btn">返回</p>
                        <!-- 获取验证码按钮 -->
                        <button class="get-code-btn btn">获取验证码</button>
                    </div>
                    <!-- 注册按钮 -->
                    <button type="submit" class="register-btn btn">注册</button>
                </div>
            </form> 
            <!-- 加载动画和成功消息 -->
            <div class="loading" id="loadingSpinner"></div>
            <div id="successMessage">注册成功！正在跳转到个人中心...</div>
        </div>
    </div>
    <script src="JS/Api.js"></script>
    <script src="JS/registration.js"></script>
</body>
</html>

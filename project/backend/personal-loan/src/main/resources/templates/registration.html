<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册界面</title>
    <link rel="stylesheet" href="../static/css/base.css">
    <link rel="stylesheet" href="../static/css/registration.css">
</head>
<body>
    <div>
        <div class="title">信息注册</div>
        <div class="main wrapper">
            <!-- 标题 -->
            <div class="part_title">
                <h2>请输入您的账户信息</h2>
                <h2>绑定手机号</h2>
            </div>
            <form id="registerForm">
                <!-- 通用错误提示 -->
                <div id="networkError" class="error-message"></div>
                <!-- 输入账户信息 -->
                <div class="base-information">
                    <div class="infor">
                        <p><i>*</i>用户名(可以是字母、数字、下划线,至少1位)</p>
                        <input type="text" placeholder="请输入用户名" id="adminName">
                        <div id="adminNameError" class="error-message"></div>

                        <p><i>*</i>密码(6-8位,且包含两种特殊符号)</p>
                        <input type="password" placeholder="请输入密码" id="password">
                        <div id="passwordError" class="error-message"></div>

                        <p><i>*</i>确认密码（请再次输入密码）</p>
                        <input type="password" placeholder="请确认密码" id="confirmPassword">
                        <div id="confirmPasswordError" class="error-message"></div>
                    </div>
                    <!-- 输入验证信息 -->
                    <div class="authentication">
                        <p><i>*</i>手机号码</p>
                        <input type="text" placeholder="请输入手机号码" id="phone">
                        <div id="phoneError" class="error-message"></div>

                        <p><i>*</i>短信验证码</p>
                        <input type="text" placeholder="请输入短信验证码" id="smsCode">
                        <div id="smsCodeError" class="error-message"></div>
                        
                        <!-- 获取验证码按钮 -->
                        <button class="get-code-btn">获取验证码</button>
                    </div>
                </div>
                <!-- 注册按钮 -->
                <button type="submit" class="register-btn">注册</button>
                <!-- 关闭按钮 -->
                <button type = "button" class="close-btn">关闭</button>
                <!-- 加载动画和成功消息 -->
                <div class="loading" id="loadingSpinner"></div>
                <div id="successMessage">注册成功！正在跳转到个人中心...</div>
            </form> 
        </div>
    </div>
    <script src="../JS/API.js"></script>
    <script src="../JS/registration.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册界面</title>
    <link rel="stylesheet" href="../static/css/base.css">
    <link rel="stylesheet" href="../static/css/registration.css">
</head>
<body>
    <div>
        <div class="title">信息注册</div>
        <div class="main wrapper">
            <!-- 标题 -->
            <h2>请输入您的账户信息</h2>
            <!-- 输入账户信息 -->
            <div class="base-information">
                <div class="infor-left">
                    <p><i>*</i>用户名(9可以是字母、数字、下划线,至少8位)</p>
                    <input type="text" placeholder="请输入用户名">
                    <p><i>*</i>密码(6-8位,且包含两种特殊符号)</p>
                    <input type="password" placeholder="请输入密码">
                    <p><i>*</i>确认密码（请再次输入密码）</p>
                    <input type="password" placeholder="请输入密码">
                    <p><i>*</i>邮箱</p>
                    <input type="text" placeholder="请输入邮箱地址">
                </div>
                <div class="infor-right">
                    <p><i>*</i>真实姓名</p>
                    <input type="text" placeholder="请输入正确姓名">
                    <p><i>*</i>地区</p>
                    <input type="text" placeholder="请输入地区">
                    <p><i>*</i>证件类型</p>
                    <input type="password" placeholder="中国居民身份证//此处或有选择">
                    <p><i>*</i>证件号</p>
                    <input type="text" placeholder="请输入证件号码">
                </div>
            </div>
            <h2>请填写并验证您的手机信息</h2>
            <!-- 输入验证信息 -->
            <div class="authentication">
                <div class="auth-left">
                    <p><i>*</i>手机号码</p>
                    <input type="text" placeholder="请输入手机号码">
                </div>
                <div class="auth-right">
                    <p><i>*</i>短信验证码</p>
                    <input type="text" placeholder="请输入短信验证码">
                    <!-- 获取验证码按钮 -->
                    <button class="get-code-btn">获取验证码</button>
                </div>
            </div>
            <!-- 注册按钮 -->
            <button class="register-btn">注册</button>
            <!-- 关闭按钮 -->
             <button class="close-btn">关闭</button>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <!-- index.html -->
<nav class="nav-menu">
  <button class="nav-link active" data-target="loan-apply">代办审核</button>
  <button class="nav-link" data-target="home">首页</button>
</nav>

<div id="loan-apply-content" class="dashboard">代办审核内容</div>
<div id="home-content" class="dashboard" style="display:none">首页内容</div>

<script>
function switchToPanel(target) {
  document.querySelectorAll('.dashboard').forEach(p => p.style.display = 'none');
  document.getElementById(`${target}-content`).style.display = 'flex';
}

document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nav-link').forEach(btn => {
    btn.addEventListener('click', () => {
      switchToPanel(btn.getAttribute('data-target'));
    });
  });
});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录界面</title>
    <link rel="stylesheet" href="../static/css/base.css">
    <link rel="stylesheet" href="../static/css/login.css">
    <link rel="stylesheet" href="../static/iconfont/iconfont.css">
</head>
<body>
    <div>
        <div class="name wrapper">
            <h1>借贷APP管理员控制系统</h1> 
        </div>
        <div class="main wrapper">
            <h2>———Login———</h2>
            <div class="login-type">
                <button type="button" class="active" id="change-passwordLogin-btn">密码登录</button>
                <button type="button" id="change-smsLogin-btn">验证码登录</button>
            </div>
            
            <!-- 密码登录表单 -->
            <form class="login-form" id="passwordLoginForm">
                  <input type="text" id="phone" placeholder="请输入手机号码">
                  <div class="error-message" id="phoneError">请输入手机号码</div>

                  <div class="password-input">
                      <input type="password" id="password" placeholder="请输入密码">
                      <button type="button" id="showPassword-btn">
                          <i class="iconfont icon-browse"></i>
                          <i class="iconfont icon-eye-close"></i>
                      </button>
                  </div>
                  <div class="error-message" id="passwordError">请输入密码</div>


                <button type="submit" id="passwordLogin-submit-btn">登录</button>
                <div class="loading" id="passwordLoadingSpinner"></div>
                <div class="success-message" id="successMessage">登录成功！正在跳转...</div>
            </form>
            
            <!-- 验证码登录表单 -->
            <form class="login-form" id="smsLoginForm">
                <input type="text" id="smsPhone" placeholder="请输入手机号码">
                <div class="error-message" id="smsPhoneError">请输入手机号码</div>
                <hr>
                <br>
                <div class="sms-code-container">
                    <input type="text" id="smsCode" placeholder="请输入短信验证码">
                    <button type="button" class="get-sms-btn" id="getSmsBtn">获取验证码</button>
                </div>
                <div class="error-message" id="smsCodeError">请输入验证码</div>
                <hr>
                <br>
                <button type="submit" id="smsLogin-submit-btn">登录</button>
                <div class="loading" id="smsLoadingSpinner"></div>
                <div class="success-message" id="successMessage">登录成功！正在跳转...</div>
            </form>
            
            <div class="other">
               <span>还没有账号？<a href="/registration">注册</a></span>
              <a href="#" class="forget-password">忘记密码?</a>
            </div>
            <!-- 同意协议 -->
            <label>
                <input type="checkbox" id="agreeCheckbox">
                同意并接受<a href="#">《服务条款》</a>和<a href="#">《隐私政策》</a>
            </label>
            <div class="error-message" id="checkboxError">请同意服务条款和隐私政策!</div>
        </div>
    </div>
    <script src="../JS/AuthAPI.js"></script>
    <script src="../JS/login.js"></script>
</body>
</html>

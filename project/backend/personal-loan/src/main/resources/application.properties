# 设置统一请求前缀
server.servlet.context-path=/api

spring.application.name=personal-loan

# 使用H2内存数据库（立即可用）
spring.datasource.url=jdbc:h2:mem:personalloan
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA配置
spring.jpa.hibernate.ddl-auto=create-drop
# 显示SQL
spring.jpa.show-sql=true
# 格式化SQL
spring.jpa.properties.hibernate.format_sql=true

# H2控制台（便于查看数据）
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# 配置mybatis
mybatis.configuration.map-underscore-to-camel-case=true

# jwt配置
jwt.secret=5H6fK9pL2mN8qR4sT7vW1xY3zA0bC2dE4fG6hJ8kL0nM2oP4qR6sT8uV0wX2yZ4
jwt.expiration=86400000

# 允许前端访问
spring.web.resources.static-locations=classpath:/static/,classpath:/templates/
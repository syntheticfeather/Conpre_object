# 应用名称
spring:
  application:
    name: personal-loan

  # 数据库连接信息
  datasource:
    url: jdbc:mysql://localhost:3306/person-loan?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: admin
    password: 1234

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  # Redis 配置
  data:
    redis:
      host: localhost
      port: 6379
      password: ""  # 无密码时可设为空字符串或直接省略
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    # 开启手动 ACK（推荐用于人工审核）
    listener:
      simple:
        acknowledge-mode: manual  # 手动确认
        concurrency: 3            # 消费者最小并发数
        max-concurrency: 10       # 最大并发数

  # Thymeleaf 配置（可选，但建议显式写出）
  thymeleaf:
    enabled: true
    prefix: classpath:/templates/      # 模板文件位置
    suffix: .html                      # 模板后缀
    mode: HTML                         # HTML5 模式
    encoding: UTF-8
    cache: false                       # 开发时关闭缓存，修改页面立即生效
    servlet:
      content-type: text/html

# JWT 配置（注意：YAML 中自定义属性需放在 spring 外层）
jwt:
  secret: 5H6fK9pL2mN8qR4sT7vW1xY3zA0bC2dE4fG6hJ8kL0nM2oP4qR6sT8uV0wX2yZ4
  expiration: 86400000        # 24小时（毫秒）
  refresh:
    expiration: 604800000    # 7天（毫秒）

logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
# MyBatis 配置
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 文件存储配置
file-storage:
  # 根目录（建议使用绝对路径，生产环境不要放在项目内）
  base-dir: "D:/Conpre_object/project/backend/personal-loan/uploads"

  # 各业务类型的相对路径（相对于 base-dir）
  paths:
    avatar: avatars

    contract: contracts

    # 不动产认证
    car-proof: immovables/car
    property-proof: immovables/property

    # 第三方认证
    credit-report: tri/credit-report
    social-security: tri/social-security

    # 工作证明
    employment-proof: work/employment
    salary-proof: work/salary
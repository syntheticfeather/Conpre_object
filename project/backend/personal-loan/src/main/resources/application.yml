# 应用名称
spring:
  application:
    name: personal-loan

  # 数据库连接信息
  datasource:
    url: jdbc:mysql://localhost:3306/person-loan?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: admin
    password: 1234

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true


  # Redis 配置
  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: 6379
      password: ""
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: -1ms

  redis:
    redisson:
      config: |
        singleServerConfig:
          address: "redis://${spring.data.redis.host}:${spring.data.redis.port}"
          database: ${spring.data.redis.database}
          password: null
        lockWatchdogTimeout: 30000
        threads: 16
        nettyThreads: 32

  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin123
    virtual-host: /
    # 1. 开启发布确认机制 (Publisher Confirm)
    # 作用：让 RabbitMQ 在收到消息并持久化后，给生产者发一个 "ACK" 或 "NACK" 回执。
    # 值 "correlated" 表示：回调时会携带你发送时绑定的唯一标识 (CorrelationData)，
    # 这样你就能知道具体是哪条消息成功了，哪条失败了。
    publisher-confirm-type: correlated 

    # 2. 开启发布返回机制 (Publisher Returns)
    # 作用：当消息成功到达 Exchange，但找不到对应的队列（路由失败）时，
    # RabbitMQ 会把消息“退”回来给生产者，而不是直接丢弃。
    publisher-returns: true

    template:
      # 3. 强制路由 (Mandatory Flag)
      # 作用：配合上面的 returns 使用。
      # 设置为 true 后，如果消息无法路由到任何队列，Broker 必须触发 "ReturnCallback"。
      # 如果为 false (默认)，路由失败的消息会被 Broker 静默丢弃，你收不到任何通知。
      mandatory: true
      
    # 开启手动 ACK（推荐用于人工审核）
    listener:
      simple:
        acknowledge-mode: manual  # 手动确认
        concurrency: 3            # 消费者最小并发数
        max-concurrency: 10       # 最大并发数

  # Thymeleaf 配置（可选，但建议显式写出）
  thymeleaf:
    enabled: true
    prefix: classpath:/templates/      # 模板文件位置
    suffix: .html                      # 模板后缀
    mode: HTML                         # HTML5 模式
    encoding: UTF-8
    cache: false                       # 开发时关闭缓存，修改页面立即生效
    servlet:
      content-type: text/html

# JWT 配置（注意：YAML 中自定义属性需放在 spring 外层）
jwt:
  secret: 5H6fK9pL2mN8qR4sT7vW1xY3zA0bC2dE4fG6hJ8kL0nM2oP4qR6sT8uV0wX2yZ4
  expiration: 86400000        # 24小时（毫秒）
  refresh:
    expiration: 604800000    # 7天（毫秒）

logging:
  charset:
    console: UTF-8
    file: UTF-8
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
# MyBatis 配置
mybatis:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

# 文件存储配置
file-storage:
  # 根目录（建议使用绝对路径，生产环境不要放在项目内）
  base-dir: ./uploads

  # 各业务类型的相对路径（相对于 base-dir）
  paths:
    avatar: avatars

    contract: contracts

    # 不动产认证
    car-proof: immovables/car
    property-proof: immovables/property

    # 第三方认证
    credit-report: tri/credit-report
    social-security: tri/social-security

    # 工作证明
    employment-proof: work/employment
    salary-proof: work/salary

# 风控审批阈值 (0-750 信用分体系)
approval:
  score:
    pass: 600     # ≥600 自动通过
    reject: 400   # <400 自动拒绝，400-599 转人工

# Agent 服务配置（Python 智能客服）
agent:
  service:
    url: http://localhost:8000

# SpringDoc 配置
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
  default-consumes-media-type: application/json

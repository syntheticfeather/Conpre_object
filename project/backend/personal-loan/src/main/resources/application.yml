# 设置统一请求前缀
server:
  servlet:
    context-path: /api

# 应用名称
spring:
  application:
    name: personal-loan

  # 数据库连接信息
  datasource:
    url: jdbc:mysql://localhost:3306/person-loan?useSSL=false&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: admin
    password: 1234

  # JPA 配置
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # MyBatis 配置
  mybatis:
    configuration:
      map-underscore-to-camel-case: true
      mapper-locations: classpath*:mapper/*.xml  # 如需启用，取消注释

  # Redis 配置
  redis:
    host: localhost
    port: 6379
    password: ""  # 无密码时可设为空字符串或直接省略
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-idle: 8
        min-idle: 0
        max-wait: -1ms

# JWT 配置（注意：YAML 中自定义属性需放在 spring 外层）
jwt:
  secret: 5H6fK9pL2mN8qR4sT7vW1xY3zA0bC2dE4fG6hJ8kL0nM2oP4qR6sT8uV0wX2yZ4
  expiration: 86400000        # 24小时（毫秒）
  refresh:
    expiration: 604800000    # 7天（毫秒）
